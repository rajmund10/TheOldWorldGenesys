Actor:
  types:
    - character
    - minion
    - rival
    - nemesis
    - vehicle
  templates:
    # Has basic characteristics.
    characteristics:
      characteristics:
        brawn: 0
        agility: 0
        intellect: 0
        cunning: 0
        willpower: 0
        presence: 0
    # Adversaries
    adversary:
      soak: 0
      defense:
        melee: 0
        ranged: 0
      description: ''
      source: ''
      superCharacteristics: []
    # The four motivations.
    motivations:
      strength: &motivation
        name: ''
        description: ''
      flaw: *motivation
      desire: *motivation
      fear: *motivation
  character:
    templates:
      - characteristics
      - motivations
    defense:
      melee: 0
      ranged: 0
    soak: 0
    wounds: &combat_pool
      value: 0
      max: 0
    strain: *combat_pool
    # Character illustration image path.
    illustration: 'icons/svg/mystery-man.svg'
    # Character Description fields
    details:
      # I hate using 'gender' instead of 'pronouns' as the field, but this is needed for compatibility with Player Pronouns plugin.
      gender: ''
      age: ''
      height: ''
      build: ''
      hair: ''
      eyes: ''
      notableFeatures: ''
    # A general notes field for anything the player would like to keep on their sheet.
    notes: ''
    # Experience Journal data
    experienceJournal:
      # Individual entries noting where experience points were spent or earned.
      entries: []
      # Once the initial experience points granted by a character's archetype are spent, character creation mode is considered locked.
      locked: false
    # Encumbrance Data - This is mostly here to allow ActiveEffects to impact current Encumbrance & Encumbrance Threshold.
    encumbrance:
      # Current Encumbrance amount
      value: 0
      # Maximum Encumbrance value.
      threshold: 0
    # Legacy numeric currency value.
    currency: 0
    # Old World currency denominations.
    currencyDetails:
      gold: 0
      silver: 0
      pennies: 0
    # Equipped magic accessory currently used for spellcasting bonuses.
    activeMagicAccessoryId: ''
    # Knowledge skill currently used by magic effects that scale from Knowledge.
    activeMagicKnowledgeSkillId: ''
    # Characteristics that follow the optional Super-Characteristic rule
    superCharacteristics: []
  minion:
    templates:
      - characteristics
      - adversary
      - motivations
    # Base number of minions in the group by default. This will likely be edited on a per-token basis.
    groupSize: 4
    wounds:
      # Value expresses the number of wounds currently sustained by the group.
      value: 0
      # Threshold is the actual per-minion Wound Threshold value.
      threshold: 0
  rival:
    templates:
      - characteristics
      - adversary
      - motivations
    wounds:
      value: 0
      max: 0
  nemesis:
    templates:
      - characteristics
      - adversary
      - motivations
    wounds:
      value: 0
      max: 0
    strain:
      value: 0
      max: 0
  vehicle:
    silhouette: 0
    speed: 0
    handling: 0
    defense: 0
    armor: 0
    hullTrauma:
      value: 0
      max: 0
    systemStrain:
      value: 0
      max: 0
    illustration: 'icons/svg/mystery-man.svg'
    description: ''
    complement: ''
    consumables: ''
    source: ''
    price: 0
    rarity: 0
    currency: 0
    passengers:
      value: 0
      threshold: 0
      list: []
    encumbrance:
      value: 0
      threshold: 0
    roles: []


Item:
  types:
    # TODO: It'd be nice to do something like Pathfinder 2E does, using optgroups in the drop-down.
    # Equipment
    - armor
    - consumable
    - container
    - gear
    - magicAccessory
    - quality
    - weapon
    - vehicleWeapon
    # Character Building
    - ability
    - archetype
    - career
    - injury
    - skill
    - talent
    - specialization
    - profession
  templates:
    basic:
      # Descriptive text for the item.
      description: ''
      # Source (book & page reference).
      source: ''
    equipment:
      # Rarity Rating (0-10)
      rarity: 0
      # Encumbrance Value
      encumbrance: 0
      # Additional encumbrance threshold granted by the item.
      encumbranceThreshold: 0
      # Legacy numeric price value.
      price: 0
      # Old World price denominations.
      priceDetails:
        gold: 0
        silver: 0
        pennies: 0
        restricted: false
      # (Owned) Damage value. One of 'undamaged', 'minor', 'moderate', 'major' - See CRB p.89
      damage: 'undamaged'
      # (Owned) Inventory container where the item is held.
      container: ''
      # (Owned) How many the character possesses.
      quantity: 1
      # (Owned) Current item state. (Carried, Dropped, or Equipped)
      state: 'carried'
    baseWeapon:
      # Weapon's base damage value.
      baseDamage: 0
      # Weapon's critical rating.
      critical: 0
      # Weapon's range - one of Engaged, Close, Medium, Long, or Extreme.
      range: 'engaged'
      # Skill names that can be used when wielding the weapon.
      skills: []
      # Item qualities applicable to the weapon.
      qualities: []
  ability:
    templates: [basic]
    # Whether this talent is active or passive and, if active, details on the activation requirement.
    activation:
      type: 'passive'
      detail: ''
  archetype:
    templates: [basic]
    # Characteristics values granted by the archetype.
    characteristics:
      brawn: 2
      agility: 2
      intellect: 2
      cunning: 2
      willpower: 2
      presence: 2
    # Wound & Strain threshold bases (the number not including Brawn & Willpower)
    woundThreshold: 10
    strainThreshold: 10
    corruptionThreshold: 0
    # Starting Experience
    startingXP: 100
    # Item Data for items to grant to the character when added.
    grantedItems: []
  armor:
    templates:
      - basic
      - equipment
    defense: 0
    soak: 0
    qualities: []
  career:
    templates: [basic]
    # Stable technical key used to match the career with eligible specializations.
    key: ''
    # Item Data for career skills granted by this career.
    careerSkills: []
    # Stable specialization keys that should be offered when this career is selected.
    availableSpecializationKeys: []
    # Inventory items granted by this career when added to a character.
    grantedItems: []
    # (Owned) The list of skill IDs the character took a rank in.
    selectedSkillIDs: []
  consumable:
    templates:
      - basic
      - equipment
  container:
    templates:
      - basic
      - equipment
    open: false
  injury:
    templates: [basic]
    severity: 'average'
  gear:
    templates:
      - basic
      - equipment
  magicAccessory:
    templates:
      - basic
      - equipment
    # Magic skill this accessory is intended to support.
    magicSkill: ''
    # Base damage bonus for magic Attack spells. Automation will use it later.
    attackDamageBonus: 0
    # Whether this accessory has an Attack spell damage bonus in its table profile.
    hasAttackDamageBonus: false
    # Stable accessory category for future magic automation.
    accessoryType: ''
  skill:
    templates: [basic]
    # Which characteristic the skill uses.
    characteristic: 'brawn'
    # Which category (general, magic, etc) the skill belongs to.
    category: 'general'
    # Whether the skill can be used for Initiative rolls.
    initiative: false
    # (Owned) Whether this skill is a career skill for the character.
    career: false
    # (Owned) Ranks the player has in the skill.
    rank: 0
  talent:
    templates: [basic]
    # Talent's base tier (Effective tier is increased when a ranked talent is purchased multiple times, however).
    tier: 1
    # Whether this talent is active or passive and, if active, details on the activation requirement.
    activation:
      type: 'active'
      detail: ''
    # Whether the talent can be taken multiple times.
    ranked: 'no'
    # Whether the talent's effects scale with rank.
    scalesWithRank: 'no'
    # (Owned) How many times the talent has been taken, if it's a ranked talent.
    rank: 1
  specialization:
    templates: [basic]
    # Stable technical key used to match careers, imports, and specialization choices.
    key: ''
    # XP cost to acquire this specialization
    cost: 0
    # Requirements to take this specialization
    requirements: ''
    # Benefits granted by the specialization
    benefits: ''
    # Social status shown on the character header when this specialization is active.
    socialStatus: ''
    # Additional career skills granted by this specialization.
    careerSkills: []
    # Inventory items granted by this specialization when added to a character.
    grantedItems: []
    # Optional magic access metadata used by Old World style specializations.
    magicAccess:
      enabled: false
      tradition: ''
      school: ''
      lore: ''
      deity: ''
      allowOvercast: false
      allowMiscast: false
    # Profession progression within this specialization.
    professionPath: []
  profession:
    templates: [basic]
    # List of specialization item IDs allowed for this profession
    allowedSpecializations: []
    # Career skills provided by this profession
    careerSkills: []
  quality:
    templates: [basic]
    # Whether the quality passively applies or must be activated by spending Advantage.
    activation: 'passive'
    # Whether the quality can have different rating levels applied to it.
    isRated: true
  weapon:
    templates:
      - basic
      - equipment
      - baseWeapon
    # Characteristic added to damage value.
    damageCharacteristic: '-'
  vehicleWeapon:
    templates:
      - basic
      - equipment
      - baseWeapon
    # Directions a weapon can be fired, based on its mounting.
    firingArc:
      fore: false
      aft: false
      port: false
      starboard: false


