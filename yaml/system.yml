version: 0.2.18
compatibility:
  minimum: 12
  verified: 13
  maximum: 13
authors:
  - name: Mezryss
    url: https://github.com/Mezryss/FVTT-Genesys
  - name: rajmund10
    url: https://github.com/rajmund10/TheOldWorldGenesys
scripts:
  - scripts/container-query-polyfill/container-query-polyfill.modern.js
esmodules:
  - Genesys.js
styles:
  - style.css
languages:
