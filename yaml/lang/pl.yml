Genesys:
  System:
    Name: Genesys

  Settings:
    SkillsCompendium: Kompendium umiejętności
    SkillsCompendiumHint: Kompendium przedmiotów zawierające wszystkie umiejętności, które mają być dodawane nowym postaciom. Zmiana tej wartości nie wpłynie na już istniejące postaci.
    GameProfile: Profil gry
    GameProfileHint: Wybierz wariant Genesys używany w świecie. Profil przełącza domyślną kartę postaci oraz sposób zapisu waluty i cen.
    GameProfileChoose: Wybierz świat gry
    GameProfileCurrent: Aktualny wybór
    GameProfileConfirm: Zatwierdź wybór
    GameProfileConfigured: Profil gry został skonfigurowany
    GameProfileConfiguredHint: Ukryta flaga pierwszej konfiguracji świata. Jeśli jest wyłączona, MG zobaczy kafelki wyboru profilu po wejściu do świata.
    GameProfileGenesys: Genesys
    GameProfileGenesysHint: Tam, gdzie wszystko zaczyna się od czystej kartki, a resztę dopisuje stół.
    GameProfileOldWorld: 'The Old World: Grim and Perilous'
    GameProfileOldWorldHint: Brudne ulice, stare katedry i wojna, która nigdy nie daje o sobie zapomnieć.
    GameProfileAurora: Aurora
    GameProfileAuroraHint: Chłodny blask nad własnym światem, gdzie każda mapa ma jeszcze białe plamy.
    GameProfileWarcraft: Warcraft
    GameProfileWarcraftHint: Wojna, magia i dawne królestwa, które nigdy nie śpią spokojnie.
    DefaultDifficulty: Domyślna trudność
    DefaultDifficultyHint: >-
      Domyślne modyfikatory puli kości, które powinny zostać dodane podczas wykonywania testu.
      Ta wartość może zostać pominięta, jeśli trudność testu jest znana.
      Wyjaśnienie wszystkich modyfikatorów i ich glifów znajdziesz tutaj: [[Dice-Pool-Modification-Glyphs|Glify modyfikacji puli kości]].
    Money: Nazwa waluty
    MoneyHint: Nazwa waluty używanej w danej kampanii, np. złoto, kredyty, gotówka lub dublony.
    CareerSkillRanks: Rangi umiejętności kariery
    CareerSkillRanksHint: Liczba umiejętności, które można wybrać z listy umiejętności kariery podczas tworzenia postaci.
    UncoupleSkillsAlternateRule: Rozłącz umiejętności od cech
    UncoupleSkillsAlternateRuleHint: Pozwala wybrać alternatywną cechę dla umiejętności w oknie puli kości, zgodnie z opcjonalną zasadą rozłączania umiejętności od cech.
    ShowDamageOnFailure: Pokazuj obrażenia przy niepowodzeniu
    ShowDamageOnFailureHint: Określa, czy na kartach ataku na czacie mają być widoczne obrażenia, trafienie krytyczne i cechy broni nawet przy nieudanym rzucie.
    SkillForInjuries: Nazwa umiejętności leczenia obrażeń krytycznych
    SkillForInjuriesHint: Nazwa umiejętności używanej przy dochodzeniu do siebie po obrażeniach krytycznych.
    SkillForRepairingVehicleHits: Nazwa umiejętności naprawy trafień krytycznych pojazdu
    SkillForRepairingVehicleHitsHint: Nazwa umiejętności używanej przy naprawie trafień krytycznych pojazdu.
    DicePoolCollapseModifications: Zwiń sekcję modyfikacji puli
    DicePoolCollapseModificationsHint: Jeśli włączone, sekcja "Modyfikacje puli" będzie zwinięta przy początkowym renderowaniu okna rzutu.
    DicePoolAutoApplyModifications: Automatycznie stosuj modyfikatory puli
    DicePoolAutoApplyModificationsHint: Jeśli włączone, wszystkie modyfikatory mogące wpłynąć na pulę kości zostaną zastosowane przy otwieraniu okna rzutu.
    DicePoolChanceToSucceedByPermutation: Oblicz szansę powodzenia puli kości
    DicePoolChanceToSucceedByPermutationHint: >-
      Po włączeniu system uruchomi Web Workera, który policzy dokładną szansę powodzenia.
      Jeśli jednak pula korzysta z supercechy, wynik będzie zaniżony, bo obliczenie zakłada brak efektu eksplozji.
      Dla pul wykorzystujących supercechy dokładniejsze wyniki można uzyskać przez symulację.
    DicePoolChanceToSucceedBySimulation: Przybliż szansę powodzenia puli kości
    DicePoolChanceToSucceedBySimulationHint: >-
      Liczba symulowanych rzutów używana do przybliżenia szansy powodzenia.
      Zwiększenie tej wartości bezpośrednio wpływa na wydajność Foundry; dobrym punktem wyjścia jest 100.
      Wartość 0 wyłącza tę funkcję.
      To ustawienie jest ignorowane, jeśli szansa jest już obliczana inną metodą.
    SuperCharacteristics: Supercechy
    SuperCharacteristicsHint: Pozwala oznaczać cechy jako supercechy podczas tworzenia postaci, zgodnie z opcjonalną zasadą supercech.

  Tooltips:
